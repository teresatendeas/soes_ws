soes_state:
  ros__parameters:

    # ========================
    # --- TIMING PARAMETERS ---
    # ========================
    settle_before_pump_s: 2.0
    pump_on_s: 2.0
    swirl_time_s: 1.0
    order: [0, 1, 2]

    # ========================
    # --- ROLLER PARAMETERS ---
    # ========================
    roller_distance_mm: 70.0
    roller_speed_mm_s: 7.0

    # ==========================
    # --- VISION PARAMETERS ----
    # ==========================
    camera_timeout_s: 50.0

    # ==========================
    # --- TESTING PARAMETERS ---
    # ==========================
    test_period_s: 3.0
    test_amp_rad: [3.14, 3.14, 3.14]
    test_servo_deg: [30.0, 150.0]

    # ==========================
    # --- ARM / IK PARAMETERS ---
    # ==========================
    rate_hz: 20.0
    pos_tol_m: 0.01
    settle_s: 0.5

    link_lengths_m: [0.00, 0.17, 0.14, 0.04]

    kp_cart: 1.0
    damping_lambda: 0.1
    qdot_limit_rad_s: [3.0, 3.0, 3.0, 3.0]

    q_min_rad: [-314.16, -157.08, -157.08, -1.5708]
    q_max_rad: [ 314.16,  157.08,  157.08,  1.5708]

    q_home_rad: [0.0, 1.5708, -1.5708, 0.0]
    kp_joint: 3.0
    home_tol_rad: 0.314

    R0: 0.025
    turns: 3
    alpha: -0.03
    height: 0.04
    omega: 2.0

    move_profile_time_s: 1.0   # smoother move to cupcake
    home_profile_time_s: 1.0   # smoother move back home
